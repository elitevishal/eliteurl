<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password — EliteURL</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#0b0d1a;--body:#41465c;--accent:#3b3ff2;--line:#e8eaf3;--bg:#f7f8fc}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:28px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 30px;width:100%;max-width:420px;box-shadow:0 24px 60px -34px rgba(20,24,80,.35)}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3b3ff2,#7b5cff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
h1{font-size:23px;letter-spacing:-.02em;margin:22px 0 8px}
.sub{color:var(--body);font-size:14px;margin:0 0 24px;line-height:1.55}
label{display:block;font-size:12.5px;font-weight:650;color:var(--body);margin-bottom:8px}
input{width:100%;padding:14px 15px;font-size:15px;font-family:inherit;border:1px solid var(--line);border-radius:12px;background:#fbfbfe;outline:none}
input:focus{border-color:#a9abff;box-shadow:0 0 0 4px #eeeefe;background:#fff}
.btn{width:100%;padding:15px;font-size:15px;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;margin-top:8px}
.btn:disabled{background:#c8cbe0}
.msg{font-size:13.5px;margin-top:16px;padding:12px 14px;border-radius:11px;display:none;line-height:1.5}
.msg.show{display:block}.msg.err{background:#fdeeee;color:#b3261e}.msg.ok{background:#eafaf2;color:#0d6b47}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta property="og:image" content="https://eliteofficial.in/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="EliteURL — Shorten Links. Get Paid for Every View.">
<meta property="og:site_name" content="EliteURL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://eliteofficial.in/og.jpg">
<meta name="twitter:title" content="EliteURL — Free URL Shortener That Pays You">
<meta name="twitter:description" content="No withdrawal fee, $5 minimum, paid within 12 hours by UPI, PayPal or bank.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#3b3ff2">
</head><body>
<div class="card">
  <a class="brand" href="/"><span class="mark">E</span>EliteURL</a>
  <h1>Set a new password</h1>
  <p class="sub">Choose a password with at least 8 characters.</p>
  <form id="f">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
    <button class="btn" id="btn">Save password</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
var f=document.getElementById('f'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
var token=new URLSearchParams(location.search).get('token')||'';
function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err');}
if(!token)show('This link is missing its token. Request a new one.',false);
f.addEventListener('submit',function(e){
  e.preventDefault();
  var pw=document.getElementById('password').value;
  if(pw.length<8){show('Password must be at least 8 characters.',false);return;}
  btn.disabled=true;btn.textContent='Saving…';
  fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,password:pw})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
    .then(function(x){
      btn.disabled=false;btn.textContent='Save password';
      if(x.s===200){show('Password updated. Redirecting to sign in…',true);setTimeout(function(){location.href='/login';},1200);}
      else show(x.d.error||'Could not reset the password.',false);
    })
    .catch(function(){btn.disabled=false;btn.textContent='Save password';show('Network error.',false);});
});
</script></body></html>
