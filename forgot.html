<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password — EliteURL</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0d1a;--body:#41465c;--muted:#6b7086;--accent:#3b3ff2;--line:#e8eaf3;--bg:#f7f8fc}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:28px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 30px;width:100%;max-width:430px;box-shadow:0 24px 60px -34px rgba(20,24,80,.35)}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3b3ff2,#7b5cff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
h1{font-size:22px;letter-spacing:-.02em;margin:22px 0 8px}
.sub{color:var(--body);font-size:14px;margin:0 0 24px;line-height:1.55}
label{display:block;font-size:12.5px;font-weight:650;color:var(--body);margin-bottom:8px}
input{width:100%;padding:14px 15px;font-size:15px;font-family:inherit;border:1px solid var(--line);border-radius:12px;background:#fbfbfe;outline:none;letter-spacing:0}
input:focus{border-color:#a9abff;box-shadow:0 0 0 4px #eeeefe;background:#fff}
#code{letter-spacing:10px;text-align:center;font-size:22px;font-weight:800}
.btn{width:100%;padding:15px;font-size:15px;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;margin-top:10px}
.btn:disabled{background:#c8cbe0}
.msg{font-size:13.5px;margin-top:16px;padding:12px 14px;border-radius:11px;display:none;line-height:1.5}
.msg.show{display:block}.msg.err{background:#fdeeee;color:#b3261e}.msg.ok{background:#eafaf2;color:#0d6b47}
.alt{text-align:center;font-size:14px;margin-top:22px}.alt a{color:var(--accent);font-weight:700;text-decoration:none}
.hide{display:none}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head><body>
<div class="card">
  <a class="brand" href="/"><span class="mark">E</span>EliteURL</a>

  <div id="step1">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we will send a 6-digit verification code.</p>
    <form id="f1">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button class="btn" id="b1">Send code</button>
    </form>
  </div>

  <div id="step2" class="hide">
    <h1>Enter your code</h1>
    <p class="sub">We sent a 6-digit code to <b id="sentto"></b>. It expires in 10 minutes.</p>
    <form id="f2">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <button class="btn" id="b2">Verify code</button>
    </form>
    <p class="alt"><a href="#" id="resend">Send a new code</a></p>
  </div>

  <div id="step3" class="hide">
    <h1>Set a new password</h1>
    <p class="sub">Code verified. Now choose a new password for your account.</p>
    <form id="f3">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <button class="btn" id="b3">Reset password</button>
    </form>
  </div>

  <div class="msg" id="msg"></div>
  <p class="alt"><a href="/login">Back to sign in</a></p>
</div>
<script>
var msg=document.getElementById('msg');
function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err');}
function hideMsg(){msg.className='msg';}
var emailVal='';

document.getElementById('f1').addEventListener('submit',function(e){
  e.preventDefault();hideMsg();
  emailVal=document.getElementById('email').value.trim();
  if(!emailVal){show('Enter your email address.',false);return;}
  var b=document.getElementById('b1');b.disabled=true;b.textContent='Sending…';
  fetch('/api/auth/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:emailVal})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
    .then(function(x){
      b.disabled=false;b.textContent='Send code';
      if(x.s===200){
        document.getElementById('sentto').textContent=emailVal;
        document.getElementById('step1').classList.add('hide');
        document.getElementById('step2').classList.remove('hide');
        show(x.d.message||'Code sent.',true);
      } else show(x.d.error||'Could not send the code.',false);
    })
    .catch(function(){b.disabled=false;b.textContent='Send code';show('Network error.',false);});
});

var resetToken='';

document.getElementById('f2').addEventListener('submit',function(e){
  e.preventDefault();hideMsg();
  var code=document.getElementById('code').value.replace(/\D/g,'');
  if(code.length!==6){show('Enter the 6-digit code.',false);return;}
  var b=document.getElementById('b2');b.disabled=true;b.textContent='Checking…';
  fetch('/api/auth/verify-otp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:emailVal,code:code})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
    .then(function(x){
      b.disabled=false;b.textContent='Verify code';
      if(x.s===200 && x.d.reset_token){
        resetToken=x.d.reset_token;
        document.getElementById('step2').classList.add('hide');
        document.getElementById('step3').classList.remove('hide');
        hideMsg();
        document.getElementById('password').focus();
      } else show(x.d.error||'That code is wrong.',false);
    })
    .catch(function(){b.disabled=false;b.textContent='Verify code';show('Network error.',false);});
});

document.getElementById('f3').addEventListener('submit',function(e){
  e.preventDefault();hideMsg();
  var pw=document.getElementById('password').value;
  if(pw.length<8){show('Password must be at least 8 characters.',false);return;}
  var b=document.getElementById('b3');b.disabled=true;b.textContent='Saving…';
  fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:resetToken,password:pw})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d};});})
    .then(function(x){
      b.disabled=false;b.textContent='Reset password';
      if(x.s===200){show('Password updated. Redirecting…',true);setTimeout(function(){location.href='/login';},1200);}
      else show(x.d.error||'Could not reset the password.',false);
    })
    .catch(function(){b.disabled=false;b.textContent='Reset password';show('Network error.',false);});
});

document.getElementById('resend').addEventListener('click',function(e){
  e.preventDefault();
  fetch('/api/auth/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:emailVal})})
    .then(function(r){return r.json();}).then(function(d){show(d.message||d.error||'Done.',!!d.ok);});
});
</script>
</body></html>
